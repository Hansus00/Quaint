name: Python Unit Tests

on: [push]

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.10"

      - name: Set up Python
        run: uv python install 3.10

      - name: Install dependencies
        run: uv sync --python 3.10

      - name: Run pytest
        run: uv run pytest